name: Jadwal Shalat Harian

on:
  schedule:
    # GitHub Actions pake UTC. 23:00 UTC = 06:00 WIB (hari besoknya).
    - cron: "0 14 * * *"
  workflow_dispatch:   
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kirim jadwal ke Google Chat
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          TARGET_DAY: tomorrow     # ganti ke "today" kalau mau jadwal hari ini
          PROVINSI: Jawa Tengah
          KABKOTA: Kota Surakarta
        run: python send_schedule.py
